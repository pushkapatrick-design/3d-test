<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power transformer explorer</title>
<style>
  :root {
    --ink: #172026;
    --ink-soft: #3d4a52;
    --panel: #141b20;
    --panel-line: #2c3840;
    --text: #eef2f4;
    --muted: #a8b4bb;
    --amber: #f3a51d;
    --amber-deep: #b86f00;
    --display: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 0.95vw, 22px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdfea; }
  body { font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #c:active { cursor: grabbing; }
  #hs-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  /* heading block */
  #hud { position: absolute; left: 1.6rem; top: 1.3rem; max-width: 26rem; pointer-events: none; text-shadow: 0 0 6px rgba(255,255,255,.95), 0 0 14px rgba(255,255,255,.8); }
  .eyebrow { margin: 0 0 .2rem; font: 600 .78rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--amber-deep); }
  h1 { margin: 0; font: 700 2.1rem/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  #progress { margin: .5rem 0 0; font: 600 .9rem/1.2 var(--display); letter-spacing: .04em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .is-done #progress { color: #1d6b3a; }
  #hint { margin: .55rem 0 0; font-size: .92rem; line-height: 1.4; color: var(--ink-soft); max-width: 20rem; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, #p-title:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 6px var(--ink); }

  #reset { position: absolute; right: 1.4rem; top: 1.3rem; min-height: 44px; padding: 0 1rem; border: 1px solid rgba(23,32,38,.25); border-radius: 999px; background: rgba(255,255,255,.82); font: 600 .88rem/1 var(--display); letter-spacing: .05em; }
  #reset:hover { background: #fff; }

  /* numbered chips */
  #chips { position: absolute; left: 50%; bottom: 1.3rem; transform: translateX(-50%); display: flex; gap: .45rem; padding: .4rem; border-radius: 999px; background: rgba(20,27,32,.86); }
  .chip { width: 2.5rem; height: 2.5rem; min-width: 40px; min-height: 40px; border-radius: 50%; border: 2px solid transparent; background: transparent; color: var(--text); font: 700 1rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .chip:hover { background: rgba(255,255,255,.12); }
  .chip.is-visited { border-color: var(--amber); }
  .chip.is-current { background: var(--amber); color: var(--ink); border-color: var(--amber); }

  /* markers pinned to the model */
  .hs { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; pointer-events: auto; transition: opacity .25s; }
  .hs-dot { position: absolute; left: -1.35rem; top: -1.35rem; width: 2.7rem; height: 2.7rem; min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: var(--ink); border: 3px solid #fff; font: 700 1.1rem/1 var(--display); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .hs-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--amber); animation: ping 2.2s ease-out infinite; }
  .hs.is-visited .hs-dot { background: var(--panel); color: var(--amber); border-color: var(--amber); }
  .hs.is-visited .hs-dot::after, .hs.is-current .hs-dot::after { display: none; }
  .hs.is-current .hs-dot { background: #fff; color: var(--ink); border-color: var(--amber); transform: scale(1.12); }
  .hs.is-behind { opacity: .4; }
  .hs-label { position: absolute; left: 1.9rem; top: -.85rem; white-space: nowrap; padding: .35rem .7rem; border-radius: .35rem; background: var(--panel); color: var(--text); font: 600 .85rem/1 var(--display); letter-spacing: .03em; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; pointer-events: none; }
  .hs:hover .hs-label, .hs:focus-visible .hs-label { opacity: 1; transform: none; }
  .hs.is-current .hs-label { display: none; }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(1.75); opacity: 0; } }

  /* callout */
  #panel { position: absolute; right: 1.4rem; top: 50%; transform: translateY(-50%); width: min(27rem, 38vw); max-height: calc(100% - 9rem); overflow: auto; padding: 1.4rem 1.5rem 1.1rem; border-radius: .6rem; background: var(--panel); color: var(--text); border-top: 4px solid var(--amber); box-shadow: 0 18px 50px rgba(0,0,0,.35); animation: rise .3s ease-out; }
  #panel[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }
  .p-head { display: flex; align-items: center; gap: .8rem; }
  #p-num { flex: none; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: var(--ink); font: 700 1.1rem/1 var(--display); }
  #p-title { flex: 1; margin: 0; font: 700 1.45rem/1.1 var(--display); outline: none; text-wrap: balance; }
  #p-close { flex: none; width: 44px; height: 44px; margin-right: -.5rem; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 1.5rem; line-height: 1; }
  #p-close:hover { background: rgba(255,255,255,.1); color: #fff; }
  #p-body { margin: 1rem 0 0; font-size: 1rem; line-height: 1.55; color: #dbe2e6; }
  .field { margin: 1.1rem 0 0; padding: .8rem .95rem; border-left: 3px solid var(--amber); background: #1d272e; border-radius: 0 .35rem .35rem 0; }
  .field b { display: block; margin-bottom: .3rem; font: 600 .74rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  #p-field { margin: 0; font-size: .95rem; line-height: 1.5; }
  .p-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--panel-line); }
  .p-foot button { min-height: 44px; padding: 0 1.1rem; border-radius: 999px; border: 1px solid #4a5a64; background: transparent; font: 600 .9rem/1 var(--display); letter-spacing: .04em; }
  .p-foot button:hover { border-color: #fff; }
  #p-next { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  #p-next:hover { background: #ffb938; border-color: #ffb938; }
  #p-count { font: 600 .85rem/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }

  #nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; background: #e9edf0; font-size: 1.1rem; }
  #nogl[hidden] { display: none; }

  @media (max-width: 719px) {
    #hud { left: 1rem; top: .9rem; right: 7.5rem; }
    h1 { font-size: 1.55rem; }
    #reset { right: .8rem; top: .8rem; }
    #chips { bottom: max(.8rem, env(safe-area-inset-bottom)); }
    .hs-label { display: none; }
    .panel-open #chips { display: none; }
    #panel { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-height: 52%; border-radius: .9rem .9rem 0 0; padding: 1.1rem 1.1rem max(.9rem, env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hs-dot::after, #panel { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="3D model of a substation power transformer. Drag to rotate, or use the left and right arrow keys."></canvas>
  <div id="hs-layer"></div>

  <header id="hud">
    <p class="eyebrow">Substation equipment</p>
    <h1>Power transformer</h1>
    <p id="progress" aria-live="polite"></p>
    <p id="hint">Drag to rotate. Pinch or scroll to zoom. Select a numbered point to learn about that part.</p>
  </header>

  <button id="reset" type="button">Reset view</button>
  <nav id="chips" aria-label="Transformer parts"></nav>

  <aside id="panel" hidden aria-label="Part details">
    <div class="p-head">
      <span id="p-num" aria-hidden="true"></span>
      <h2 id="p-title" tabindex="-1"></h2>
      <button id="p-close" type="button" aria-label="Close and return to full view">&times;</button>
    </div>
    <p id="p-body"></p>
    <div class="field"><b>In the field</b><p id="p-field"></p></div>
    <div class="p-foot">
      <button id="p-prev" type="button">Previous</button>
      <span id="p-count"></span>
      <button id="p-next" type="button">Next</button>
    </div>
  </aside>

  <div id="nogl" hidden>This 3D model needs WebGL, which is turned off or unavailable in this browser.</div>
</div>
